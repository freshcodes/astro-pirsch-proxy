name: CI

on: [push]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run format check
        run: npm run format -- --check

      - name: Run type check
        run: npx astro check

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build
